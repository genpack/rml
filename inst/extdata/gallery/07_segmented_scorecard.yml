# The scorecard plus a customer segmentation: k-means clusters of the customer profile,
# replaced by each cluster's default rate. It captures risk that belongs to a segment
# rather than to one column.
model:
  class: CLS.STATS.LR
  name: segmented_scorecard
  transformers:
  - class: MAP.RML.ZFS
    name: linear
    features: [tenure, late_30d, num_accounts]
  - class: FNT.RML.LOG
    name: log_income
    features: [income]
  - class: FNT.RML.POLY
    name: age_curve
    n_terms: 2
    transformers:
    - class: MAP.RML.ZFS
      name: z_age
      features: [age]
  - class: BIN.RML.OBB
    name: utilisation_cut
    features: [utilisation]
  - class: FET.RML.D2MUL
    name: debt_x_util
    features: [debt_ratio, utilisation]
  - class: ENC.RML.TE
    name: category_rates
    smoothing: 20
    features: [region, postcode, employment, product]
  - class: ENC.RML.TE
    name: segment_rate
    transformers:
    - class: BIN.KMEANS.KMC
      name: segments
      num_clusters: 4
      transformers:
      - class: MAP.RML.ZFS
        name: z_profile
        features: [age, income, tenure, num_accounts]
