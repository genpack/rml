# The average of two different models: xgboost and the scorecard. Their errors
# differ, so the average is often better than either.
model:
  class: ENS.RML.AGGR
  name: blend
  aggregator: mean
  transformers:
  - class: CLS.XGBOOST
    name: blend_xgboost
    nrounds: 300
    max_depth: 4
    eta: 0.05
    subsample: 0.8
    transformers:
    - class: MAP.RML.IDT
      name: blend_numerics
      features: [age, income, tenure, num_accounts, utilisation, debt_ratio, late_30d]
    - class: ENC.RML.TE
      name: blend_category_rates
      smoothing: 20
      features: [region, postcode, employment, product]
  - class: CLS.STATS.LR
    name: blend_scorecard
    transformers:
    - class: MAP.RML.ZFS
      name: linear
      features: [tenure, late_30d, num_accounts]
    - class: FNT.RML.LOG
      name: log_income
      features: [income]
    - class: FNT.RML.POLY
      name: age_curve
      n_terms: 2
      transformers:
      - class: MAP.RML.ZFS
        name: z_age
        features: [age]
    - class: BIN.RML.OBB
      name: utilisation_cut
      features: [utilisation]
    - class: FET.RML.D2MUL
      name: debt_x_util
      features: [debt_ratio, utilisation]
    - class: ENC.RML.TE
      name: category_rates
      smoothing: 20
      features: [region, postcode, employment, product]
